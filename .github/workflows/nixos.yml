name: "NixOS"
on:
  push:
  workflow_dispatch:
env:
  TMPDIR: /mnt/tmp
jobs:
  nixos:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
      - name: Print
        run: |
          whoami
          pwd
          ls
          lscpu
          free -h
          df -h
          sudo mkdir -p /mnt/build
          sudo mkdir -p /mnt/tmp
          sudo chmod 777 /mnt/tmp
          sudo systemctl set-environment TMPDIR=/mnt/tmp
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            build-dir = /mnt/build
      - uses: cachix/cachix-action@v17
        with:
          name: rvfg
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: nix-community
      - name: Build
        id: build
        run: |
          set -eu
          nix build .#devShells.x86_64-linux.default
          has_failure=0
          for host in nixos/*; do
            host=${host#nixos/}
            if [[ "$(nix eval .#nixosConfigurations."$host".pkgs.stdenv.hostPlatform.system)" = '"x86_64-linux"' ]]; then
              echo "::group::Build $host"
              exit_code=0
              nix build .#nixosConfigurations."$host".config.system.build.toplevel || exit_code=$?
              echo "::endgroup::"
              if [[ "$exit_code" -ne 0 ]]; then
                has_failure=1
                echo "Failed to build $host"
              fi
            fi
          done
          echo "::group::Debug"
          df -Th
          echo "::endgroup::"
          if [[ "$has_failure" -ne 0 ]]; then exit 1; fi
      - name: Deploy
        if: ${{ github.ref == 'refs/heads/main' && steps.build.outcome == 'success' }}
        env:
          SSH_KEY: ${{secrets.DEPLOY_SSH_KEY}}
        run: |
          mkdir -p ~/.ssh
          printenv SSH_KEY > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          nix-shell -p openssh --run 'nix run .#ci-deploy'
